name: OpenShelf
options:
  bundleIdPrefix: com.forddevinc
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"

targets:
  OpenShelf:
    type: application
    platform: iOS
    sources:
      - path: OpenShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forddevinc.OpenShelf
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_ENTITLEMENTS: OpenShelf/OpenShelf.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_KEY_NSCameraUsageDescription: "Open Shelf uses your camera to scan book barcodes for quick adding."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Open Shelf lets you pick a cover image from your photos for manually added books."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Open Shelf uses Face ID to protect your private books."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Open Shelf checks your local weather to show personalised reading suggestions. Your location is never stored or shared."
    info:
      path: OpenShelf/Info.plist
      properties:
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.forddevinc.OpenShelf.authorcheck
        CFBundleURLTypes:
          - CFBundleURLName: "com.forddevinc.OpenShelf"
            CFBundleURLSchemes:
              - openshelf

  OpenShelfWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenShelfWidget
      - path: OpenShelf/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forddevinc.OpenShelf.widget
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: OpenShelf Widget
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    dependencies:
      - target: OpenShelf

  OpenShelfShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenShelfShareExtension
      - path: OpenShelf/Models
      - path: OpenShelf/Services/BookURLParser.swift
      - path: OpenShelf/Services/OpenLibraryClient.swift
      - path: OpenShelf/Services/SharedModelContainer.swift
      - path: OpenShelf/Services/DTOs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forddevinc.OpenShelf.share-extension
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_ENTITLEMENTS: OpenShelfShareExtension/OpenShelfShareExtension.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Open Shelf
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    info:
      path: OpenShelfShareExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    dependencies:
      - target: OpenShelf
