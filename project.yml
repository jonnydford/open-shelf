name: OpenShelf
options:
  bundleIdPrefix: com.openshelf
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"

targets:
  OpenShelf:
    type: application
    platform: iOS
    sources:
      - path: OpenShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openshelf.app
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_ENTITLEMENTS: OpenShelf/OpenShelf.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_KEY_NSCameraUsageDescription: "Open Shelf uses your camera to scan book barcodes for quick adding."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Open Shelf lets you pick a cover image from your photos for manually added books."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Open Shelf uses Face ID to protect your private books."
    info:
      path: OpenShelf/Info.plist
      properties:
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.openshelf.authorcheck
        CFBundleURLTypes:
          - CFBundleURLName: "com.openshelf.app"
            CFBundleURLSchemes:
              - openshelf

  OpenShelfWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenShelfWidget
      - path: OpenShelf/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openshelf.app.widget
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: OpenShelf Widget
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    dependencies:
      - target: OpenShelf
